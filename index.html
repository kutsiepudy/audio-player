<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kristin's Lil Ipod</title>
</head>
<body>
  <div class="player">
    <div class="details">
      <div class="track-name"></div>
      <div class="track-artist"></div>
      <div class="release-date"></div>
      <div class="description"></div>
    </div>

    <div class="buttons">
      <button aria-label="Previous track">⏮</button>
      <button id="play-pause" aria-label="Play or pause">▶︎</button>
      <button aria-label="Next track">⏭</button>
      <button id="loop" aria-label="Loop Song">Loop: OFF</button>
    </div>

    <div class="time">
      <span id="current-time">0:00</span>
      <span> / </span>
      <span id="max-time">0:00</span>
    </div>

    <div class="sliders">
      <label>Seek</label>
      <input type="range" min="0" max="100" value="0" class="seek_slider" aria-label="Seek">

      <label>Volume</label>
      <input type="range" min="0" max="100" value="100" class="volume_slider" aria-label="Volume">
    </div>

    <audio id="main-audio"></audio>
  </div>
  <button id="showDesc">?</button>
  <div class="cursor-container" id="PumpkinPieCookie">
    <img src="cursor/pumpkinPieCookieIdle.png" id="cursorAsset" class="cursor-graphic">
  </div>
  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="style.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kristin's Lil Ipod</title>
</head>
<body>
  <div class="player">
    <div class="details">
      <div class="track-name"></div>
      <div class="track-artist"></div>
      <div class="release-date"></div>
      <div class="description"></div>
    </div>

    <div class="buttons">
      <button onclick="previousTrack()" aria-label="Previous track">⏮</button>
      <button id="play-pause" onclick="playPauseTrack()" aria-label="Play or pause">▶︎</button>
      <button onclick="nextTrack()" aria-label="Next track">⏭</button>
    </div>

    <div class="time">
      <span id="current-time">0:00</span>
      <span> / </span>
      <span id="max-time">0:00</span>
    </div>

    <div class="sliders">
      <label>Seek</label>
      <input type="range" min="0" max="100" value="0" class="seek_slider" oninput="seekTo()" aria-label="Seek">

      <label>Volume</label>
      <input type="range" min="0" max="100" value="100" class="volume_slider" oninput="setVolume()" aria-label="Volume">
    </div>

    <audio id="main-audio"></audio>
  </div>

  <script src="script.js"></script>
</body>
</html>
